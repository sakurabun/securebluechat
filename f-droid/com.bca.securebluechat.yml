AutoName: SecureBlue Chat

Summary: Encrypted Bluetooth chat with no internet or accounts

Description: |
  A two-phone messenger that runs entirely over Bluetooth. There is no internet
  permission and no server: the phones talk to each other directly.

  Every message is sealed with AES-256-GCM. The key is derived from a PIN that
  both people type, stretched with PBKDF2-HMAC-SHA256 over a random per-session
  salt, and a challenge-response handshake proves both sides derived the same
  key before any message is shown.

  Features include a typing indicator, message timestamps, long-press copy and
  delete, and a local chat history that survives restarts. History is sealed
  with a separate key held in the Android Keystore, so the stored file is not
  readable on another device.

